# 蚕班（三虫·茧，4h）
name: worm-weave
on:
  schedule:
    - cron: "41 */4 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.CI_OPS_APP_ID || vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_OPS_APP_KEY || secrets.CI_APP_KEY }}
          owner: chepin-ai
      - name: 蚕班（三虫·茧，4h）
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 worms/weave.py
